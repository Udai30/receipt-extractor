# Alembic configuration (BACKEND_SCHEMA §S6).
# Revisions are written by the agent and APPLIED BY THE HUMAN: `uv run alembic upgrade head`.
# The database URL is never stored here: migrations/env.py reads DATABASE_URL via Settings.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# New revisions: uv run alembic revision -m "short description" --rev-id 0002
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
timezone = UTC

[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
