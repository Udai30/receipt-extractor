[project]
name = "receipt-extractor"
version = "0.1.0"
description = "A receipt photo goes in; validated JSON comes out — OCR+LLM vs a vision LLM, compared on accuracy, latency and cost."
readme = "README.md"
authors = [
    { name = "Udai30", email = "udaij30@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "litellm>=1.106.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0.3",
    "typer>=0.12",
]

[project.scripts]
receipt_extractor = "receipt_extractor.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]

# --- Quality tooling (TRD §S8) -------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# *.md: specification documents are prose; their code blocks are illustrative.
# .claude/: agent tooling (git guard hook), not project source; edit-locked for the agent.
extend-exclude = ["*.md", ".claude"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF",
    "S",    # bandit security checks
    "PTH",  # pathlib over os.path (TRD §S9)
    "DTZ",  # timezone-aware datetimes
    "T20",  # no stray print()
    "PL",
]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "e2e: drives a running app",
    "live: calls real provider APIs; opt-in with `-m live`, skipped without keys",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["receipt_extractor"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
